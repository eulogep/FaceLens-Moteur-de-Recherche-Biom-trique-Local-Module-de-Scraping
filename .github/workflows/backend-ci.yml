name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Pytest and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install \
            --requirement requirements.txt \
            --requirement requirements-dev.txt

      - name: Prepare offline InsightFace fallback
        run: mkdir -p "$HOME/.insightface/models/buffalo_l"

      - name: Run backend tests
        run: python -m pytest -p no:cacheprovider tests/ -v

      - name: Audit runtime dependencies
        run: python -m pip_audit --requirement requirements.txt --strict
