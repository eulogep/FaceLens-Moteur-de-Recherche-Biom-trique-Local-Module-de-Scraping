name: Backend CI

on:
  push:
    branches:
      - main
      - "security/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Pytest and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      FACELENS_API_KEY: ci-only-key-with-at-least-thirty-two-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --requirement requirements.txt \
            --requirement requirements-dev.txt
          python -m pip check

      - name: Prepare offline InsightFace fallback
        run: mkdir -p "$HOME/.insightface/models/buffalo_l"

      - name: Run backend and security tests
        run: python -m pytest -p no:cacheprovider tests/ -v

      - name: Audit runtime dependencies
        run: python -m pip_audit --requirement requirements.txt --strict
